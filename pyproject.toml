[project]
name = "reader-for-neurodivergents"
version = "1.1.3"
description = "Local Markdown read-aloud reader with real-time word highlighting powered by Kokoro-82M"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "numpy>=1.26,<3",
    "python-json-logger>=3.2,<5",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
tts = [
    "kokoro==0.9.4",
    "misaki[en]==0.9.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6.0,<8",
    "httpx>=0.28,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pip-audit>=2.9,<3",
    "vulture>=2.14,<3",
    "pre-commit>=4.0,<5",
]

[tool.uv]
package = false
constraint-dependencies = ["filelock>=4.2.0"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.12"
mypy_path = ["server", "typings"]
strict = true
warn_unreachable = true
files = ["server", "tests/python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["server"]
addopts = "--cov=server --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
source = ["server"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true

language: "en-US"
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "server/**"
      instructions: >-
        Review for security (input bounds, CORS, TLS handling, no outbound telemetry),
        architecture (word-splitter parity with web/js/document.js, cgroup thread pinning
        before torch import), performance (LRU cache, WAV encoding), testing, and Python
        strict typing conventions.
    - path: "web/js/**"
      instructions: >-
        Review for accessibility (dyslexia/ADHD reading accommodations, keyboard navigation,
        reduced motion), architecture (character-range highlight sync), performance,
        security (DOMPurify sanitization), testing, and ES module conventions.
    - path: ".github/**"
      instructions: >-
        Review for security (least-privilege permissions, third-party action SHA pinning,
        no pull_request_target checkout of PR head) and fast CI feedback.

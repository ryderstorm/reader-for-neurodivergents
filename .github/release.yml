changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Features
      labels:
        - enhancement
        - feat
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Security and Dependencies
      labels:
        - security
        - dependencies
    - title: Maintenance and Docs
      labels:
        - "*"

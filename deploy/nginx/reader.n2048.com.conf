# nginx site for reader.n2048.com
#
#   sudo cp deploy/nginx/reader.n2048.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/reader.n2048.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot add the TLS block:
#   sudo certbot --nginx -d reader.n2048.com
#
# Certbot rewrites this file in place, adding the listen 443 block, the
# certificate paths and the http->https redirect. Everything below survives.

# limit_req_zone must be in nginx's http context. This file is included from
# inside http{} (that is what sites-enabled is), so declaring it here is valid
# and keeps the whole site in one file. Splitting it into conf.d/ works too,
# but then forgetting to copy the second file produces only
#   nginx: [emerg] zero size shared memory zone "reader"
# which does not say what is missing.
#
# 1 request/second sustained per client IP, burst of 8, applied to /api/speak
# alone. Static assets are deliberately unlimited: a cold page load fetches
# about twenty of them at once and would otherwise be throttled.
limit_req_zone $binary_remote_addr zone=reader:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name reader.n2048.com;

    # --- who may use it ----------------------------------------------------
    # The application itself has no login. Without this, anyone who finds the
    # hostname can spend the droplet's two vCPUs generating speech.
    #
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd-reader <username>
    #
    # Comment these two lines out to make it fully public.
    auth_basic           "Read Aloud";
    auth_basic_user_file /etc/nginx/.htpasswd-reader;

    # The health endpoint stays open so uptime checks do not need credentials.
    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8765;
        access_log off;
    }

    # --- limits ------------------------------------------------------------
    # Submitted text is capped at 8000 characters by the API itself.
    client_max_body_size 256k;

    # Synthesis is CPU-bound. A long sentence on two vCPUs can take 10-20 s,
    # and nginx's 60 s default would cut it off as a 504.
    proxy_read_timeout    180s;
    proxy_send_timeout    180s;
    proxy_connect_timeout 10s;

    # Rate limiting applies ONLY to synthesis, which is the expensive call.
    # See the limit_req_zone above the server block.
    location = /api/speak {
        # One reader prefetches three sentences ahead, so a small burst is
        # normal; sustained 1/s is far more than a person can consume and
        # makes the droplet useless as a free speech API.
        limit_req zone=reader burst=8 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding   "gzip";
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The app gzips its own JSON, so nginx passes it through untouched.
        # Asking for it explicitly keeps that true if the app ever stops.
        proxy_set_header Accept-Encoding "gzip";

        # Audio responses are up to ~1 MB. Buffering them frees the upstream
        # worker as soon as it has finished, which matters with only two vCPUs.
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }

    # --- headers -----------------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/reader.access.log;
    error_log  /var/log/nginx/reader.error.log;
}

# Goes in /etc/nginx/conf.d/ — limit_req_zone must live in the http context,
# not inside a server block.
#
#   sudo cp deploy/nginx/reader-ratelimit.conf /etc/nginx/conf.d/
#
# Applied only to /api/speak in the site config, with a burst of 8. Synthesis
# is the only expensive endpoint; static assets are deliberately not limited,
# because a cold page load fetches about twenty of them at once.
limit_req_zone $binary_remote_addr zone=reader:10m rate=1r/s;
